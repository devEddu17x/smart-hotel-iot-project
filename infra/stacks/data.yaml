AWSTemplateFormatVersion: '2010-09-09'
Description: DynamoDB tables for event history and RFID card access control

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, qa, prod]
    Description: Deployment environment (dev, qa, prod)

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Resources:
  EventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub 'smart-hotel-events-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: buildingId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: buildingId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: smart-hotel-iot

  RfidCardsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub 'smart-hotel-rfid-cards-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cardUid
          AttributeType: S
        - AttributeName: departmentId
          AttributeType: S
      KeySchema:
        - AttributeName: cardUid
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: DepartmentIndex
          KeySchema:
            - AttributeName: departmentId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: smart-hotel-iot

  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub 'smart-hotel-users-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: departmentId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: DepartmentIndex
          KeySchema:
            - AttributeName: departmentId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: smart-hotel-iot

Outputs:
  EventsTableName:
    Description: Events DynamoDB table name
    Value: !Ref EventsTable
  EventsTableArn:
    Description: Events DynamoDB table ARN
    Value: !GetAtt EventsTable.Arn
  RfidCardsTableName:
    Description: RFID cards DynamoDB table name
    Value: !Ref RfidCardsTable
  RfidCardsTableArn:
    Description: RFID cards DynamoDB table ARN
    Value: !GetAtt RfidCardsTable.Arn
  UsersTableName:
    Description: Users DynamoDB table name
    Value: !Ref UsersTable
  UsersTableArn:
    Description: Users DynamoDB table ARN
    Value: !GetAtt UsersTable.Arn
